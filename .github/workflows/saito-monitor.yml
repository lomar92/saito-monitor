name: Restock Monitor

on:
  workflow_dispatch:
    inputs:
      watch:
        required: false
        default: ""
  schedule:
    - cron: "0 */3 * * *"

concurrency:
  group: monitor-a
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: saito_state.json
          key: state-a-${{ github.run_id }}
          restore-keys: state-a-

      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: "@everyone"
          POLL_INTERVAL: "12"
          MAX_RUNTIME: ${{ inputs.watch != '' && '60' || '20400' }}
          ALERT_COOLDOWN: "180"
          QUANTITY: "2"
          HEARTBEAT_HOURS: "0"
          STATUS_EVERY: "300"
          STATE_FILE: saito_state.json
          WATCH: ${{ inputs.watch }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
        run: python saito_monitor.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: saito_state.json
          key: state-a-${{ github.run_id }}

      - name: Next
        if: (success() || failure()) && inputs.watch == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run saito-monitor.yml --ref ${{ github.ref_name }}
