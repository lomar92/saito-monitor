name: Monitor B

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */3 * * *"

concurrency:
  group: monitor-b
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache/restore@v4
        with:
          path: inventory_state.json
          key: state-b-${{ github.run_id }}
          restore-keys: state-b-

      - name: Run
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          POLL_INTERVAL: "30"
          MAX_RUNTIME: "20400"
          STATE_FILE: inventory_state.json
          KEYWORDS: "box,booster,blister,sakura"
        run: python inventory_tracker.py

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: inventory_state.json
          key: state-b-${{ github.run_id }}

      - name: Next
        if: success() || failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run inventory-tracker.yml --ref ${{ github.ref_name }}
